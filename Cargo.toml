[package]
name = "lazyllm"
version = "0.1.0"
edition = "2024"
description = "A lazygit-style TUI for chatting with LLMs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
async-trait = "0.1"
futures = "0.3"
tui-markdown = "0.3"
arboard = "3"
base64 = "0.22"
rusqlite = { version = "0.34", features = ["bundled"] }

[dev-dependencies]
mockito = "1"
tokio-test = "0.4"
tempfile = "3"
pretty_assertions = "1"
insta = "1"
